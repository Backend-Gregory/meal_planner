<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планы — Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/plans.js" defer></script>
    <script src="js/pages/plans.js" defer></script>
    <script src="js/navbar.js" defer></script>
</head>
<body class="bg-gradient-custom">
    <div id="toastContainer" class="toast-container"></div>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-nav-custom fixed-top">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> Meal Planner</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="recipes.html"><i class="fas fa-book-open"></i> Рецепты</a></li>
                        <li class="nav-item"><a class="nav-link active" href="plans.html"><i class="fas fa-calendar-alt"></i> Планы</a></li>
                        <li class="nav-item"><a class="nav-link" href="shopping.html"><i class="fas fa-shopping-cart"></i> Список</a></li>
                        <li class="nav-item" id="admin-link"><a class="nav-link" href="admin.html"><i class="fas fa-shield-alt"></i> Админ</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Профиль</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container py-4 slide-up">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h1 class="text-white text-shadow"><i class="fas fa-calendar-alt" style="color: #e94560;"></i> План на неделю</h1>
                <div class="d-flex gap-2 flex-wrap align-items-center">
                    <button id="prevWeekBtn" class="btn btn-outline-light"><i class="fas fa-chevron-left"></i></button>
                    <input type="date" id="weekPicker" class="form-control" style="width:auto;max-width:150px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:10px;">
                    <button id="currentWeekBtn" class="btn btn-accent"><i class="fas fa-calendar-day"></i> Текущая</button>
                    <button id="nextWeekBtn" class="btn btn-outline-light"><i class="fas fa-chevron-right"></i></button>
                    <button id="copyPlanBtn" class="btn btn-outline-light"><i class="fas fa-copy"></i> Копировать</button>
                    <button id="createPlanBtn" class="btn btn-success"><i class="fas fa-plus"></i> Создать</button>
                </div>
            </div>
            <div id="plans-container" class="row"></div>
        </div>
    </main>

    <div class="modal fade" id="editPlanModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit" style="color:#e94560;"></i> Редактировать день</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="editPlanBody"><p class="text-center text-muted">Загрузка...</p></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
