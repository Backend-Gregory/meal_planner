<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты — Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/recipes.js" defer></script>
    <script src="js/pages/recipes.js" defer></script>
    <script src="js/navbar.js" defer></script>
</head>
<body class="bg-gradient-custom">
    <div id="toastContainer" class="toast-container"></div>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-nav-custom fixed-top">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> Meal Planner</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="recipes.html"><i class="fas fa-book-open"></i> Рецепты</a></li>
                        <li class="nav-item"><a class="nav-link" href="plans.html"><i class="fas fa-calendar-alt"></i> Планы</a></li>
                        <li class="nav-item"><a class="nav-link" href="shopping.html"><i class="fas fa-shopping-cart"></i> Список</a></li>
                        <li class="nav-item" id="admin-link"><a class="nav-link" href="admin.html"><i class="fas fa-shield-alt"></i> Админ</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Профиль</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container py-4 slide-up">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h1 class="text-white text-shadow"><i class="fas fa-book-open" style="color: #e94560;"></i> Рецепты</h1>
                <a href="create-recipe.html" class="btn btn-accent"><i class="fas fa-plus"></i> Создать рецепт</a>
            </div>

            <div class="row mb-4 g-2">
                <div class="col-md-5">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Поиск по названию..." style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:10px;">
                </div>
                <div class="col-md-4">
                    <select id="categoryFilter" class="form-select" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:10px;">
                        <option value="">Все категории</option>
                        <option value="breakfast">🍳 Завтрак</option>
                        <option value="lunch">🥗 Обед</option>
                        <option value="dinner">🍽 Ужин</option>
                        <option value="dessert">🍰 Десерт</option>
                        <option value="snack">🍿 Перекус</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-accent w-100" id="searchBtn"><i class="fas fa-search"></i> Найти</button>
                </div>
            </div>

            <div id="recipes-container" class="row"></div>

            <div class="d-flex justify-content-center align-items-center gap-3 mt-4" id="paginationContainer">
                <button id="prevPageBtn" class="btn btn-outline-light" style="display:none;">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button id="nextPageBtn" class="btn btn-outline-light" style="display:none;">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
